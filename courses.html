<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程学习 - 认真交易</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* Course page specific styles */
.courses-layout{display:flex;width:100%;height:100%;overflow:hidden}
.courses-list{width:320px;flex-shrink:0;overflow-y:auto;padding:16px;border-right:1px solid var(--border);background:#fff}
.courses-list::-webkit-scrollbar{width:4px}
.courses-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.courses-player{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f8f9fb}
.courses-player-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:12px}
.courses-player-empty .empty-icon{font-size:64px;opacity:.3}
.courses-player-empty .empty-text{font-size:14px}

/* Teacher card */
.course-teacher{margin-bottom:16px}
.course-teacher-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fafbfc;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .25s;user-select:none}
.course-teacher-header:hover{border-color:var(--blue);background:rgba(41,98,255,.03)}
.course-teacher-header.expanded{border-color:var(--blue);background:rgba(41,98,255,.05);border-bottom-left-radius:0;border-bottom-right-radius:0}
.course-teacher-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.course-teacher-info{flex:1}
.course-teacher-name{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:2px}
.course-teacher-count{font-size:11px;color:var(--text2)}
.course-teacher-arrow{font-size:12px;color:var(--text2);transition:transform .25s}
.course-teacher-header.expanded .course-teacher-arrow{transform:rotate(90deg)}

/* Category group inside teacher */
.course-category{border:1px solid var(--border);border-top:none;overflow:hidden}
.course-category:first-of-type{border-radius:0 0 8px 8px}
.course-category-header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f5f7fa;cursor:pointer;transition:all .2s;user-select:none;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)}
.course-category-header:hover{background:rgba(41,98,255,.04);color:var(--blue)}
.course-category-header .cat-arrow{font-size:10px;transition:transform .25s}
.course-category-header.cat-open .cat-arrow{transform:rotate(90deg)}
.course-category-header .cat-name{font-weight:600;flex:1}
.course-category-header .cat-count{font-family:var(--pixel);font-size:8px;opacity:.6}
.course-category-eps{max-height:0;overflow:hidden;transition:max-height .3s ease}
.course-category-eps.cat-open{max-height:500px}

/* Episode item */
.course-episode{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 22px;cursor:pointer;transition:all .2s;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.course-episode:last-child{border-bottom:none}
.course-episode:hover{background:rgba(41,98,255,.04);color:var(--blue)}
.course-episode.active{background:rgba(41,98,255,.06);color:var(--blue);font-weight:600}
.course-episode-num{width:24px;height:24px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:8px;color:var(--text2);flex-shrink:0}
.course-episode.active .course-episode-num{background:var(--blue);color:#fff}
.course-episode-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course-episode-play{font-size:14px;opacity:.5}
.course-episode:hover .course-episode-play{opacity:1}

/* Player area */
.player-wrapper{width:100%;height:100%;display:flex;flex-direction:column}
.player-header{padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.player-header .player-teacher{font-size:12px;color:var(--text2)}
.player-header .player-title{font-family:var(--pixel);font-size:10px;color:var(--blue);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-frame-wrap{flex:1;min-height:0;position:relative;background:#000}
.player-frame-wrap iframe{width:100%;height:100%;border:none;display:block}

/* Notes area */
.notes-area{flex-shrink:0;background:#fff;border-top:1px solid var(--border);display:flex;flex-direction:column;max-height:200px;min-height:80px}
.notes-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.notes-header .notes-label{font-family:var(--pixel);font-size:9px;color:var(--blue);display:flex;align-items:center;gap:6px}
.notes-header .notes-status{font-size:10px;color:var(--green);opacity:0;transition:opacity .3s}
.notes-header .notes-status.show{opacity:1}
.notes-textarea{flex:1;width:100%;border:none;outline:none;resize:none;padding:12px 16px;font-size:13px;line-height:1.7;color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;background:transparent}
.notes-textarea::placeholder{color:var(--border2)}
.notes-textarea::-webkit-scrollbar{width:4px}
.notes-textarea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Responsive: stack on mobile */
@media(max-width:768px){
  .courses-layout{flex-direction:column}
  .courses-list{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .courses-player{min-height:60vh}
  .notes-area{max-height:150px}
}
</style>
</head>
<body>
<div id="nav-header"></div>
<div id="root"></div>
<div id="nav-sidebar"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ---- 课程数据（老师 → 分类 → 视频） ---- */
const COURSES = [
  {
    id: 'fangfangtu',
    name: '方方土价格行为学',
    avatar: '',
    color: '#2962ff',
    categories: [
      {
        name: 'K线基础知识',
        episodes: [
          { title: '为什么稳定盈利应该是一件很轻松的事情？', bvid: 'BV12WuP61Ej2' }
        ]
      },
      {
        name: '杂项',
        episodes: []
      }
    ]
  },
  {
    id: 'jingxin',
    name: '静心方能就行',
    avatar: '🧘',
    color: '#26a69a',
    categories: []
  },
  {
    id: 'bitlanglang',
    name: 'bit浪浪',
    avatar: '🌊',
    color: '#7b1fa2',
    categories: []
  }
];

/* ---- 注解存储 ---- */
const NOTES_KEY = 'pa_course_notes';
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveNotes(notes) {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function App() {
  const [expandedTeacher, setExpandedTeacher] = useState(null);
  const [openCategories, setOpenCategories] = useState({}); // { teacherId: { catIndex: bool } }
  const [activeVideo, setActiveVideo] = useState(null); // { teacherId, teacherName, catName, title, bvid }
  const [notes, setNotes] = useState(loadNotes);
  const [noteText, setNoteText] = useState('');
  const [savedFlash, setSavedFlash] = useState(false);
  const saveTimer = useRef(null);

  /* 当切换视频时，加载对应注解 */
  useEffect(() => {
    if (activeVideo) {
      const key = activeVideo.bvid;
      setNoteText(notes[key] || '');
    } else {
      setNoteText('');
    }
  }, [activeVideo]);

  /* 自动保存注解（防抖 800ms） */
  const handleNoteChange = useCallback((text) => {
    setNoteText(text);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      if (!activeVideo) return;
      const key = activeVideo.bvid;
      const updated = { ...notes, [key]: text };
      setNotes(updated);
      saveNotes(updated);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1500);
    }, 800);
  }, [activeVideo, notes]);

  const toggleTeacher = (id) => {
    setExpandedTeacher(prev => prev === id ? null : id);
  };

  const toggleCategory = (teacherId, catIndex) => {
    setOpenCategories(prev => {
      const teacherCats = prev[teacherId] || {};
      return {
        ...prev,
        [teacherId]: { ...teacherCats, [catIndex]: !teacherCats[catIndex] }
      };
    });
  };

  const playVideo = (teacher, catName, episode) => {
    setActiveVideo({
      teacherId: teacher.id,
      teacherName: teacher.name,
      catName,
      title: episode.title,
      bvid: episode.bvid
    });
  };

  const countEpisodes = (teacher) => {
    if (!teacher.categories) return 0;
    return teacher.categories.reduce((sum, cat) => sum + (cat.episodes ? cat.episodes.length : 0), 0);
  };

  return (
    <div className="screen" style={{padding:0,alignItems:'stretch'}}>
      <div className="courses-layout">
        {/* 左侧课程列表 */}
        <div className="courses-list">
          <div style={{fontFamily:'var(--pixel)',fontSize:'10px',color:'var(--blue)',marginBottom:'14px',padding:'0 2px'}}>
            📚 课程列表
          </div>
          {COURSES.map(teacher => {
            const isExpanded = expandedTeacher === teacher.id;
            const totalEps = countEpisodes(teacher);
            const teacherCats = openCategories[teacher.id] || {};
            return (
              <div className="course-teacher" key={teacher.id}>
                <div
                  className={'course-teacher-header' + (isExpanded ? ' expanded' : '')}
                  onClick={() => toggleTeacher(teacher.id)}
                >
                  <div className="course-teacher-avatar" style={{background: teacher.color + '12', color: teacher.color}}>
                    {teacher.avatar}
                  </div>
                  <div className="course-teacher-info">
                    <div className="course-teacher-name">{teacher.name}</div>
                    <div className="course-teacher-count">
                      {totalEps > 0 ? totalEps + ' 集' : '待更新'}
                    </div>
                  </div>
                  <span className="course-teacher-arrow">▶</span>
                </div>

                {isExpanded && (
                  <div className="course-episodes open" style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px'}}>
                    {!teacher.categories || teacher.categories.length === 0 ? (
                      <div style={{padding:'12px 14px',fontSize:'12px',color:'var(--text2)',fontStyle:'italic'}}>
                        课程即将上线...
                      </div>
                    ) : (
                      teacher.categories.map((cat, ci) => {
                        const isCatOpen = !!teacherCats[ci];
                        return (
                          <div className="course-category" key={ci}>
                            <div
                              className={'course-category-header' + (isCatOpen ? ' cat-open' : '')}
                              onClick={() => toggleCategory(teacher.id, ci)}
                            >
                              <span className="cat-arrow">▶</span>
                              <span className="cat-name">{cat.name}</span>
                              <span className="cat-count">{cat.episodes.length} 集</span>
                            </div>
                            <div className={'course-category-eps' + (isCatOpen ? ' cat-open' : '')}>
                              {cat.episodes.length === 0 ? (
                                <div style={{padding:'8px 14px 8px 22px',fontSize:'11px',color:'var(--text2)',fontStyle:'italic'}}>
                                  暂无视频
                                </div>
                              ) : (
                                cat.episodes.map((ep, ei) => {
                                  const isActive = activeVideo && activeVideo.bvid === ep.bvid;
                                  return (
                                    <div
                                      key={ei}
                                      className={'course-episode' + (isActive ? ' active' : '')}
                                      onClick={() => playVideo(teacher, cat.name, ep)}
                                    >
                                      <span className="course-episode-num">{String(ei + 1).padStart(2, '0')}</span>
                                      <span className="course-episode-title">{ep.title}</span>
                                      <span className="course-episode-play">▶</span>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* 右侧播放器 + 注解 */}
        <div className="courses-player">
          {activeVideo ? (
            <div className="player-wrapper">
              <div className="player-header">
                <span className="player-teacher">{activeVideo.teacherName}</span>
                <span className="player-title">{activeVideo.title}</span>
              </div>
              <div className="player-frame-wrap">
                <iframe
                  src={`//player.bilibili.com/player.html?bvid=${activeVideo.bvid}&high_quality=1&danmaku=0`}
                  scrolling="no"
                  border="0"
                  frameBorder="no"
                  framespacing="0"
                  allowFullScreen="true"
                  title={activeVideo.title}
                />
              </div>
              {/* 注解区域 */}
              <div className="notes-area">
                <div className="notes-header">
                  <span className="notes-label"> 我的注解</span>
                  <span className={'notes-status' + (savedFlash ? ' show' : '')}>已保存</span>
                </div>
                <textarea
                  className="notes-textarea"
                  placeholder="在这里记录你的学习笔记..."
                  value={noteText}
                  onChange={(e) => handleNoteChange(e.target.value)}
                />
              </div>
            </div>
          ) : (
            <div className="courses-player-empty">
              <div className="empty-icon">🎬</div>
              <div className="empty-text">从左侧选择一个课程开始学习</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="shared-nav.js?v=5"></script>
<script>renderPageNav()</script>
</body>
