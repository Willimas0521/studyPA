<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f3f7;--bg2:#ffffff;--bg3:#e8ecf1;
  --green:#26a69a;--red:#ef5350;--gold:#f7931a;--blue:#2962ff;--purple:#7b1fa2;--cyan:#2962ff;
  --text:#131722;--text2:#787b86;--border:#e0e3eb;--border2:#d1d4dc;
  --pixel:'Press Start 2P',monospace;
  --card-bg:#ffffff;--card-border:#e0e3eb;
  --neon-glow:none;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif}
body::before{content:'';position:fixed;inset:0;background:
  linear-gradient(0deg,transparent 96%,rgba(41,98,255,.04) 100%),
  linear-gradient(90deg,transparent 96%,rgba(41,98,255,.04) 100%);
  background-size:24px 24px;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(41,98,255,.01) 100%);z-index:0;pointer-events:none}
#root{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.screen{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.screen::-webkit-scrollbar{width:5px}
.screen::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.screen::-webkit-scrollbar-track{background:transparent}

/* Header */
.header{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.header h1{font-family:var(--pixel);font-size:11px;color:var(--blue);letter-spacing:2px}
.xp-bar{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:9px;color:var(--blue)}
.xp-bar .bar{width:100px;height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden}
.xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--blue),#42a5f5);transition:width .6s cubic-bezier(.4,0,.2,1);border-radius:3px}

/* Map */
.map-container{width:100%;max-width:600px;padding:20px 0}
.chapter-section{margin-bottom:28px}
.chapter-title{font-family:var(--pixel);font-size:10px;color:var(--blue);padding:10px 16px;margin-bottom:10px;text-align:center;background:rgba(41,98,255,.04);border-radius:6px;border:1px solid rgba(41,98,255,.15);letter-spacing:1px}
.chapter-desc{font-size:12px;color:var(--text2);text-align:center;margin-bottom:10px}
.level-path{display:flex;flex-direction:column;align-items:center;gap:0}
.level-node{position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.level-node:hover{transform:scale(1.12)}
.level-node .circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid;transition:all .35s cubic-bezier(.4,0,.2,1)}
.level-node.locked .circle{background:#f5f5f5;border-color:var(--border);filter:grayscale(.6)}
.level-node.locked{cursor:default;opacity:.35}
.level-node.locked:hover{transform:none}
.level-node.available .circle{background:rgba(41,98,255,.06);border-color:var(--blue);box-shadow:0 2px 12px rgba(41,98,255,.2);animation:nodePulse 2.5s ease-in-out infinite}
.level-node.completed .circle{background:rgba(38,166,154,.06);border-color:var(--green);box-shadow:0 2px 8px rgba(38,166,154,.15)}
.level-node.perfect .circle{background:rgba(41,98,255,.06);border-color:var(--blue);box-shadow:0 2px 12px rgba(41,98,255,.2)}
.level-stars{position:absolute;bottom:-4px;display:flex;gap:2px}
.level-stars .star{font-size:9px;color:var(--border2);transition:color .3s}
.level-stars .star.earned{color:var(--gold);text-shadow:none}
.path-connector{width:2px;height:18px;background:var(--border);margin:0 auto;transition:background .3s}
.path-connector.active{background:var(--green)}

@keyframes nodePulse{0%,100%{box-shadow:0 2px 12px rgba(41,98,255,.15)}50%{box-shadow:0 2px 20px rgba(41,98,255,.3)}}

/* Level screen */
.level-screen{width:100%;max-width:600px}
.level-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.level-header .back-btn{background:#fff;border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .25s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.level-header .back-btn:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 2px 8px rgba(41,98,255,.1)}
.level-header .level-name{font-family:var(--pixel);font-size:10px;color:var(--blue)}
.progress-bar{width:100%;height:5px;background:#e8ecf1;border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:3px}

/* Chart */
.chart-container{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.chart-container canvas{width:100%;height:auto;display:block}

/* Question */
.question-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.question-type{font-family:var(--pixel);font-size:8px;color:var(--purple);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.question-text{font-size:15px;line-height:1.7;margin-bottom:16px;color:var(--text)}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{background:#fafbfc;border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:6px;cursor:pointer;font-size:14px;text-align:left;transition:all .25s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:10px}
.option-btn:hover{border-color:var(--blue);background:rgba(41,98,255,.03);transform:translateX(3px);box-shadow:0 2px 8px rgba(41,98,255,.06)}
.option-btn.selected{border-color:var(--blue);background:rgba(41,98,255,.05);box-shadow:0 2px 8px rgba(41,98,255,.08)}
.option-btn.correct{border-color:var(--green);background:rgba(38,166,154,.06);color:#00796b;box-shadow:0 2px 8px rgba(38,166,154,.1)}
.option-btn.wrong{border-color:var(--red);background:rgba(239,83,80,.05);color:#c62828;box-shadow:0 2px 8px rgba(239,83,80,.08)}
.option-btn .key{width:26px;height:26px;border-radius:6px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:9px;flex-shrink:0;transition:all .25s;border:1px solid var(--border);color:var(--text2)}
.option-btn.correct .key{background:var(--green);color:#fff;border-color:var(--green)}
.option-btn.wrong .key{background:var(--red);color:#fff;border-color:var(--red)}

.explanation{background:rgba(41,98,255,.04);border:1px solid rgba(41,98,255,.12);border-radius:6px;padding:14px;margin-top:14px;font-size:13px;line-height:1.7;color:var(--text2);animation:fadeSlide .3s ease}
.explanation strong{color:var(--blue)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.submit-btn{width:100%;padding:14px;background:var(--blue);border:none;color:#fff;font-family:var(--pixel);font-size:11px;border-radius:6px;cursor:pointer;transition:all .25s;margin-top:8px;box-shadow:0 2px 8px rgba(41,98,255,.2);letter-spacing:1px}
.submit-btn:hover{background:#1e53e5;box-shadow:0 4px 16px rgba(41,98,255,.25);transform:translateY(-1px)}
.submit-btn:disabled{opacity:.35;cursor:default;transform:none}

.next-btn{width:100%;padding:14px;background:var(--green);border:none;color:#fff;font-family:var(--pixel);font-size:11px;border-radius:6px;cursor:pointer;transition:all .25s;margin-top:8px;box-shadow:0 2px 8px rgba(38,166,154,.2);letter-spacing:1px}
.next-btn:hover{background:#1e9688;box-shadow:0 4px 16px rgba(38,166,154,.25);transform:translateY(-1px)}

/* Result */
.result-screen{text-align:center;padding-top:30px}
.result-stars{font-size:48px;margin:20px 0;letter-spacing:10px}
.result-title{font-family:var(--pixel);font-size:16px;margin-bottom:8px;color:var(--blue)}
.result-score{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.result-xp{font-family:var(--pixel);font-size:12px;color:var(--green);margin-bottom:30px}
.result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.result-btns button{padding:12px 24px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;border:1px solid;transition:all .25s}
.btn-retry{background:#fff;border-color:var(--border);color:var(--text2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-retry:hover{border-color:var(--text);color:var(--text);background:#fafbfc}
.btn-next{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(41,98,255,.2)}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(41,98,255,.25)}
.btn-map{background:#fff;border-color:var(--purple);color:var(--purple)}
.btn-map:hover{background:rgba(123,31,162,.04);border-color:var(--text)}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.welcome h1{font-family:var(--pixel);font-size:18px;color:var(--blue);margin-bottom:8px}
.welcome .subtitle{color:var(--text2);font-size:14px;margin-bottom:30px;letter-spacing:3px}
.welcome .start-btn{padding:16px 44px;background:var(--blue);border:none;color:#fff;font-family:var(--pixel);font-size:12px;border-radius:8px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 16px rgba(41,98,255,.25);letter-spacing:2px}
.welcome .start-btn:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 6px 24px rgba(41,98,255,.3);background:#1e53e5}
.welcome .candle-art{margin:30px 0;font-size:56px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--pixel);border:1px solid}
.badge-easy{background:rgba(38,166,154,.08);color:var(--green);border-color:rgba(38,166,154,.2)}
.badge-medium{background:rgba(41,98,255,.06);color:var(--blue);border-color:rgba(41,98,255,.2)}
.badge-hard{background:rgba(239,83,80,.06);color:var(--red);border-color:rgba(239,83,80,.2)}

/* Toolbar */
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tool-btn{background:#fff;border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:all .25s;display:flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tool-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(41,98,255,.03);transform:translateY(-1px);box-shadow:0 2px 8px rgba(41,98,255,.08)}
.tool-btn .cnt{background:#eef1f5;border-radius:10px;padding:1px 7px;font-family:var(--pixel);font-size:8px;color:var(--blue)}
.tool-btn.cert{border-color:var(--blue);color:var(--blue);box-shadow:0 2px 8px rgba(41,98,255,.12);animation:nodePulse 2.5s ease-in-out infinite}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(19,23,34,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;animation:fadeIn .25s ease}
.modal{background:#fff;border:1px solid var(--border);border-radius:10px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.modal-wide{max-width:600px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-header h2{font-family:var(--pixel);font-size:12px;color:var(--blue)}
.modal-header button{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;transition:color .2s}
.modal-header button:hover{color:var(--text)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.ach-card{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;opacity:.35;transition:all .35s}
.ach-card.got{opacity:1;border-color:rgba(41,98,255,.2);box-shadow:0 2px 8px rgba(41,98,255,.06);background:rgba(41,98,255,.03)}
.ach-icon{font-size:28px;margin-bottom:6px}
.ach-name{font-size:13px;color:var(--text);margin-bottom:4px;font-weight:bold}
.ach-card.got .ach-name{color:var(--blue)}
.ach-desc{font-size:11px;color:var(--text2);line-height:1.4}

/* Wrong book */
.wrong-group{margin-bottom:14px}
.wrong-ch{font-family:var(--pixel);font-size:9px;color:var(--purple);margin-bottom:8px}
.wrong-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafbfc;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.wrong-q{font-size:12px;color:var(--text);line-height:1.4}
.wrong-practice{background:var(--blue);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0;transition:all .25s}
.wrong-practice:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(41,98,255,.2)}
.review-all-btn{width:100%;padding:12px;background:var(--blue);border:none;color:#fff;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:6px;font-size:13px;transition:all .25s;font-family:var(--pixel);font-size:10px}
.review-all-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(41,98,255,.2)}
.empty{text-align:center;color:var(--text2);padding:30px;font-size:14px}

/* Codex / Daily / Path */
.codex-tip{font-size:12px;color:var(--text2);line-height:1.6;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.codex-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filter-btn{background:#fff;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .25s}
.filter-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(123,31,162,.05)}
.filter-btn:hover{border-color:var(--purple);color:var(--text)}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.codex-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:all .3s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.codex-card:hover{border-color:var(--purple);box-shadow:0 4px 16px rgba(123,31,162,.08);transform:translateY(-2px)}
.codex-card-head{display:flex;align-items:center;justify-content:space-between}
.codex-name{font-family:var(--pixel);font-size:10px;color:var(--blue)}
.codex-sig{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:bold}
.sig-bull{background:rgba(38,166,154,.08);color:var(--green);border:1px solid rgba(38,166,154,.2)}
.sig-bear{background:rgba(239,83,80,.06);color:var(--red);border:1px solid rgba(239,83,80,.2)}
.sig-neutral{background:rgba(120,123,134,.08);color:var(--text2);border:1px solid rgba(120,123,134,.2)}
.codex-chart{width:100%;height:110px;background:#f8f9fb;border-radius:4px;display:block;border:1px solid var(--border)}
.codex-cat{font-size:10px;color:var(--text2)}
.codex-desc{font-size:12px;line-height:1.5;color:var(--text)}
.codex-loc{font-size:11px;color:var(--blue);line-height:1.5}

.path-overall{text-align:center;font-family:var(--pixel);font-size:11px;color:var(--blue);margin-bottom:16px}
.path-stage{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;transition:all .3s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.path-stage:hover{border-color:var(--purple);box-shadow:0 4px 12px rgba(123,31,162,.06)}
.path-stage-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.path-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:11px;color:#fff;flex-shrink:0}
.path-name{font-family:var(--pixel);font-size:10px;color:var(--text)}
.path-desc{font-size:11px;color:var(--text2)}
.path-pct{margin-left:auto;font-family:var(--pixel);font-size:12px;color:var(--blue)}
.path-bar{height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden;margin-bottom:8px}
.path-bar .fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.path-chapters{font-size:11px;color:var(--text2)}

.cp-tip{font-size:12px;color:var(--text2);text-align:center;margin-bottom:8px}
.streak-pill{background:rgba(41,98,255,.06);color:var(--blue);padding:3px 10px;border-radius:12px;font-size:11px;font-family:var(--pixel);border:1px solid rgba(41,98,255,.15)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:var(--blue);padding:12px 24px;border-radius:20px;font-size:13px;font-weight:bold;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.1);animation:toastIn .4s cubic-bezier(.4,0,.2,1);white-space:nowrap;border:1px solid var(--border);font-family:var(--pixel);font-size:10px}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}

/* Certificate */
.cert{display:flex;align-items:center;justify-content:center;min-height:82vh;padding:20px}
.cert-inner{background:#fff;border:1px solid var(--border);border-radius:12px;padding:36px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.cert-badge{font-size:60px;animation:float 3s ease-in-out infinite}
.cert-title{font-family:var(--pixel);font-size:18px;color:var(--blue);margin:12px 0 4px}
.cert-sub{font-size:9px;color:var(--text2);letter-spacing:2px;margin-bottom:18px}
.cert-name{font-size:16px;color:var(--text);margin-bottom:20px;border-top:1px dashed var(--border2);border-bottom:1px dashed var(--border2);padding:14px 0}
.cert-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.cert-stats div{background:#f8f9fb;border-radius:8px;padding:12px;border:1px solid var(--border)}
.cert-stats span{display:block;font-family:var(--pixel);font-size:18px;color:var(--blue);margin-bottom:4px}
.cert-stats small{font-size:11px;color:var(--text2)}
.cert-line{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.cert-date{font-size:11px;color:var(--text2);margin-bottom:20px}

/* EPUB Reader */
.epub-reader{display:flex;flex-direction:column;height:100%;width:100%;max-width:900px;margin:0 auto}
.epub-toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ========== CANDLE DATA HELPERS ========== */
const C=(o,c,h,l)=>({o,c,h,l});
const trend=(s,n,inc=2)=>{let r=[];for(let i=0;i<n;i++){let o=s+i*inc,c=o+inc;r.push(C(o,c,c+1,o-1))}return r};
const flat=(s,n)=>Array.from({length:n},(_,i)=>C(s+i%2,s+1+(i%2),s+2,s-1));

/* Pattern generators */
const P={
  hammer:    (p=100)=>[C(102,100,103,94)],
  invHammer: (p=100)=>[C(100,102,108,100)],
  shStar:    (p=100)=>[C(100,98,108,100)],

  bullEngulf:(p=100)=>[C(104,100,105,99),C(99,106,107,98)],
  bearEngulf:(p=100)=>[C(100,104,105,99),C(106,98,107,97)],
  bullHarami:(p=100)=>[C(98,106,107,97),C(102,100,103,99)],
  bearHarami:(p=100)=>[C(100,106,107,97),C(104,102,105,101)],
  darkCloud: (p=100)=>[C(100,105,106,99),C(106,102,107,101)],
  pierce:    (p=100)=>[C(104,100,105,99),C(99,103,104,98)],
  tweezerT:  (p=100)=>[C(100,105,108,99),C(105,100,108,99)],
  tweezerB:  (p=100)=>[C(104,100,105,97),C(100,104,105,97)],
  mornStar:  (p=100)=>[C(104,100,105,99),C(100,97,101,96),C(98,104,105,97)],
  eveStar:   (p=100)=>[C(100,104,105,99),C(104,107,108,103),C(106,100,107,99)],
  threeWS:   (p=100)=>[C(100,103,104,99),C(103,106,107,102),C(106,109,110,105)],
  threeBC:   (p=100)=>[C(106,103,107,102),C(103,100,104,99),C(100,97,101,96)],
  morningDoi:(p=100)=>[C(104,100,105,99),C(100,100,101,99),C(99,104,105,98)],

  threeInside:(p=100,bull=true)=>bull?[C(104,100,105,99),C(101,103,104,100),C(102,106,107,101)]:[C(100,104,105,99),C(103,101,104,100),C(102,98,103,97)],
  threeOutside:(p=100,bull=true)=>bull?[C(103,100,104,99),C(99,105,106,98),C(104,108,109,103)]:[C(101,104,105,100),C(105,99,106,98),C(100,97,101,96)],
};

/* ========== CHART RENDERER ========== */
function drawChart(canvas, candles, opts={}){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const pad={t:16,b:16,l:8,r:42};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;

  // Background with subtle gradient
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#ffffff');bgGrad.addColorStop(1,'#f8f9fb');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){let y=pad.t+cH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke()}

  if(!candles||!candles.length)return;
  let allH=Math.max(...candles.map(c=>c.h));
  let allL=Math.min(...candles.map(c=>c.l));
  let range=allH-allL||1;
  allH+=range*.1;allL-=range*.1;range=allH-allL;

  const n=candles.length;
  const gap=opts.gap||Math.max(4,cW/(n*2));
  const bw=(cW-gap*(n+1))/n;

  // Price labels on right axis
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.font='9px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){
    const price=allH-(range*i/4);
    const y=pad.t+cH*i/4;
    ctx.fillText(price.toFixed(1),W-pad.r+4,y+3);
  }

  candles.forEach((c,i)=>{
    const x=pad.l+gap+i*(bw+gap);
    const yH=pad.t+((allH-c.h)/range)*cH;
    const yL=pad.t+((allH-c.l)/range)*cH;
    const yO=pad.t+((allH-c.o)/range)*cH;
    const yC=pad.t+((allH-c.c)/range)*cH;
    const bull=c.c>=c.o;
    const color=bull?'#26a69a':'#ef5350';
    const top=Math.min(yO,yC);
    const bH=Math.max(Math.abs(yO-yC),2);

    // Shadow with glow
    ctx.save();
    ctx.shadowColor=color;ctx.shadowBlur=6;
    ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,bw*.12);
    ctx.beginPath();ctx.moveTo(x+bw/2,yH);ctx.lineTo(x+bw/2,yL);ctx.stroke();
    ctx.restore();

    // Body with gradient
    const bodyGrad=ctx.createLinearGradient(0,top,0,top+bH);
    if(bull){
      bodyGrad.addColorStop(0,'#26a69a');bodyGrad.addColorStop(1,'#1e8c82');
    }else{
      bodyGrad.addColorStop(0,'#ef5350');bodyGrad.addColorStop(1,'#d63d3a');
    }
    ctx.fillStyle=bodyGrad;
    ctx.shadowColor=color;ctx.shadowBlur=3;
    ctx.fillRect(x,top,bw,bH);
    ctx.shadowBlur=0;

    // Highlight glow
    if(opts.highlight===i){
      ctx.save();
      ctx.shadowColor=color;ctx.shadowBlur=16;
      ctx.strokeStyle=color;ctx.lineWidth=2;
      ctx.strokeRect(x-3,top-3,bw+6,bH+6);
      ctx.restore();
    }
  });
}

const CHAPTERS = [

         q:'绿色（白色）蜡烛表示收盘价高于开盘价，代表上涨。',
         opts:['正确','错误'],ans:0,

      ]},
      {name:'阳线与阴线',icon:'🟢',diff:'easy',questions:[
        {candles:[C(100,106,107,99)],type:'choice',
         q:'图中这根K线是什么类型？（绿色=阳线）',

// Evaluate progress/streak-based achievements; returns updated map + list of newly unlocked ids
function evalProgressAchievements(s){
  const ach = {...s.achievements};
  const newly = [];
  const completed = Object.keys(s.stars).length;
  const perfect = Object.values(s.stars).filter(v=>v===3).length;
  const unlock = (id)=>{ if(!ach[id]){ ach[id]=Date.now(); newly.push(id); } };
  if(completed>=1) unlock('first_clear');
  if(completed>=10) unlock('ten_clear');
  if(completed>=Math.ceil(TOTAL_LEVELS/2)) unlock('half_clear');
  if(completed>=TOTAL_LEVELS) unlock('all_clear');
  if(perfect>=1) unlock('first_perfect');
  if(perfect>=TOTAL_LEVELS) unlock('all_perfect');
  if(s.streak>=5) unlock('combo5');
  if(s.streak>=10) unlock('combo10');
  return {achievements:ach, newly};
}

function buildQuestionBank(){
  const bank=[];
  CHAPTERS.forEach((ch,ci)=>ch.levels.forEach((lv,li)=>lv.questions.forEach((q,qi)=>bank.push({ci,li,qi,q,chName:ch.name,lvName:lv.name}))));
  return bank;
}
const QUESTION_BANK = buildQuestionBank();

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

// Deterministic daily set: prefer wrong-book items, then seeded random fill to 5
function buildDailySet(wrongKeys){
  const rnd=mulberry32(hashStr('daily-'+todayStr()));
  const set=[];const used=new Set();
  for(const k of (wrongKeys||[])){
    if(set.length>=5) break;
    const [ci,li,qi]=k.split('-').map(Number);
    const idx=QUESTION_BANK.findIndex(b=>b.ci===ci&&b.li===li&&b.qi===qi);
    if(idx>=0&&!used.has(idx)){used.add(idx);set.push(idx);}
  }
  while(set.length<5){ const idx=Math.floor(rnd()*QUESTION_BANK.length); if(!used.has(idx)){used.add(idx);set.push(idx);} }
  return set;
}

/* --- Candlestick Chart --- */
function CandleChart({candles,highlight,label}){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && candles){
      const dpr = window.devicePixelRatio||1;
      const rect = ref.current.getBoundingClientRect();
      ref.current.width = rect.width * dpr;
      ref.current.height = (rect.height || 200) * dpr;
      ref.current.getContext('2d').scale(dpr,dpr);
      ref.current.style.width = rect.width+'px';
      drawChart(ref.current, candles, {highlight, label, gap:Math.max(6,rect.width/(candles.length*2.5))});
    }
  },[candles,highlight,label]);
  return (
    <div className="chart-container">
      <canvas ref={ref} style={{width:'100%',height:'200px'}} />
    </div>
  );
}

/* --- Confetti Effect --- */
function Confetti({active}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!active||!ref.current) return;
    const canvas=ref.current;
    const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    const particles=[];
    const colors=['#2962ff','#ef5350','#26a69a','#f7931a','#7b1fa2','#42a5f5','#ff7043'];
    for(let i=0;i<80;i++){
      particles.push({
        x:Math.random()*canvas.width,y:-20-Math.random()*200,
        vx:(Math.random()-.5)*4,vy:Math.random()*3+2,
        size:Math.random()*6+3,color:colors[Math.floor(Math.random()*colors.length)],
        rot:Math.random()*360,rotV:(Math.random()-.5)*8,
        life:1
      });
    }
    let animId;
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      particles.forEach(p=>{
        if(p.life<=0)return;
        alive=true;
        p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.rot+=p.rotV;
        p.life-=.003;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
        ctx.restore();
      });
      if(alive) animId=requestAnimationFrame(draw);
    }
    draw();
    return ()=>{cancelAnimationFrame(animId)};
  },[active]);
  if(!active) return null;
  return <canvas ref={ref} className="confetti-canvas"/>;
}

/* --- Level Screen --- */
function LevelScreen({state,onAnswer,onNext,onBack}){
  const ch = CHAPTERS[state.chapter];
  const lv = ch.levels[state.level];
  const q = lv.questions[state.qIdx];
  const total = lv.questions.length;
  const progress = ((state.qIdx + (state.answered?1:0)) / total) * 100;
  const keys = ['A','B','C','D'];

  const handleSelect = (idx)=>{
    if(state.answered) return;
    onAnswer(idx);
  };

  const getOptionClass = (idx)=>{
    if(!state.answered) return state.selected===idx?'option-btn selected':'option-btn';
    if(idx===q.ans) return 'option-btn correct';
    if(idx===state.selected && idx!==q.ans) return 'option-btn wrong';
    return 'option-btn';
  };

  return (
    <div className="screen">
      <div className="level-screen">
        <div className="level-header">
          <button className="back-btn" onClick={onBack}>← 返回</button>
          <span className="level-name">{lv.icon} {lv.name}</span>
          <span style={{fontFamily:'var(--pixel)',fontSize:9,color:'var(--text2)'}}>{state.qIdx+1}/{total}</span>
        </div>
        <div className="progress-bar"><div className="fill" style={{width:progress+'%'}}></div></div>

        <CandleChart candles={q.candles} highlight={q.highlight} />

        <div className="question-box">
          <div className="question-type">
            {q.type==='tf'?'判断题':'选择题'}
            <span className={'badge badge-'+lv.diff} style={{marginLeft:8}}>
              {lv.diff==='easy'?'简单':lv.diff==='medium'?'中等':'困难'}
            </span>
          </div>
          <div className="question-text">{q.q}</div>
          <div className="options">
            {q.opts.map((opt,idx)=>(
              <button key={idx} className={getOptionClass(idx)} onClick={()=>handleSelect(idx)} disabled={state.answered}>
                <span className="key">{keys[idx]}</span>
                <span>{opt}</span>
              </button>
            ))}
          </div>
          {state.answered && (
            <div className="explanation">
              <strong>{state.selected===q.ans?'✓ 回答正确！':'✗ 回答错误'}</strong><br/>
              {q.explain}
            </div>
          )}
        </div>

        {state.answered && (
          <button className={state.qIdx<total-1?'next-btn':'submit-btn'} onClick={onNext}
                  style={{color:'#fff'}}>
            {state.qIdx<total-1?'下一题 →':'查看结果 🎉'}
          </button>
        )}
      </div>
    </div>
  );
}

/* ========== SIMPLE MARKDOWN PARSER ========== */
function mdToHtml(md){
  if(!md) return '';
  let html = md
    /* Code blocks */
    .replace(/```([\s\S]*?)```/g, (m,c)=>'<pre><code>'+c.replace(/</g,'&lt;')+'</code></pre>')
    /* Inline code */
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    /* Headers */
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    /* Bold & italic */
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    /* Horizontal rule */
    .replace(/^---+$/gm, '<hr/>')
    /* Links */
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    /* Blockquote */
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    /* Unordered list */
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    /* Ordered list */
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  /* Wrap consecutive <li> in <ul> */
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  /* Paragraphs */
  html = html.split(/\n\n+/).map(p=>{
    p = p.trim();
    if(!p) return '';
    if(/^<(h[1-6]|ul|ol|pre|blockquote|hr)/.test(p)) return p;
    return '<p>'+p+'</p>';
  }).join('\n');
  return html;
}

 * 每本书的章节笔记，key = 书ID，value = { 章节href或匹配关键词: 笔记HTML }
 * 匹配规则：优先精确匹配 href，否则用 includes 关键词匹配
 * 用户可以随时编辑这些内容，写入自己的感悟和理解

const CHAPTER_NOTES = {
  b1: {
    /* 日本蜡烛图技术 — 示例笔记，按章节关键词匹配 */
    'cover': `<h3>📗 日本蜡烛图技术</h3><p>全书导读笔记（封面页）</p>`,

<div class="highlight">💡 提示：可以用章节标题关键词匹配，也可以用完整 href 精确匹配。</div>`,
    '_default': `<h3>📝 本章笔记</h3><p>本章笔记待完善，请在 CHAPTER_NOTES 中添加。</p>`
  },
  b2: {
    '_default': `<h3>📘 本章笔记</h3><p>金融市场技术分析 — 本章笔记待完善。</p>`
  },
  b3: {

  },
  b4: {
    '_default': `<h3>📕 本章笔记</h3><p>交易心理分析 — 本章笔记待完善。</p>`
  }
};

/* 根据当前章节 href 和目录，找到匹配的笔记 */
function findChapterNotes(bookId, href, toc){
  const notes = CHAPTER_NOTES[bookId];
  if(!notes) return CHAPTER_NOTES[bookId] && CHAPTER_NOTES[bookId]['_default'] || '<p>暂无笔记</p>';
  /* 精确匹配 href */
  if(notes[href]) return notes[href];
  /* 关键词匹配：href 包含 key */
  const keys = Object.keys(notes).filter(k=>k!=='_default');
  for(const k of keys){
    if(href && href.toLowerCase().includes(k.toLowerCase())) return notes[k];
  }
  /* 目录标签匹配：找到当前 href 对应的 TOC label，再尝试匹配 */
  if(toc && toc.length){
    const ch = toc.find(t=>t.href===href);
    if(ch){
      const label = ch.label.trim();
      for(const k of keys){
        if(label.toLowerCase().includes(k.toLowerCase())) return notes[k];
      }
    }
  }
  return notes['_default'] || '<p>暂无笔记</p>';
}

/* ========== AUTO-MAP CHAPTERS TO NOTES ========== */
/* Scan notes/ directory for .md files and map them to TOC hrefs in order */
function autoMapChaptersToNotes(toc){
  if(!toc || !toc.length) return;
  /* Try to fetch the notes index for current book */
  const bookId = window.__currentBookId;
  if(!bookId) return;

  fetch('notes/'+bookId+'/index.json')
    .then(r=>r.ok?r.json():null)
    .then(index=>{
      if(!index) return;
      /* Check if index has actual mappings (beyond cover) */
      const keys = Object.keys(index).filter(k=>!k.startsWith('_') && k!=='cover.html');
      if(keys.length > 1){
        /* Index already has mappings, use as-is */
        console.log('[Notes] 使用已有的 index.json 映射 ('+keys.length+' 个章节)');
        return;
      }
      /* Auto-generate mappings: match .md files to TOC entries in order */
      const mdFiles = [];
      /* Try to fetch ch01.md through ch20.md to see which exist */
      const promises = [];
      for(let i=1; i<=20; i++){
        const fname = 'ch'+String(i).padStart(2,'0')+'.md';
        const p = fetch('notes/'+bookId+'/'+fname, {method:'HEAD'})
          .then(r=>{ if(r.ok) mdFiles.push({idx:i, file:fname}); return null; })
          .catch(()=>null);
        promises.push(p);
      }
      return Promise.all(promises).then(()=>{
        if(mdFiles.length === 0) return;
        /* Sort by chapter number */
        mdFiles.sort((a,b)=>a.idx-b.idx);
        /* Filter TOC to only chapter-like entries (skip cover, toc, etc) */
        const chapterTocs = toc.filter(t=>{
          const h = t.href.toLowerCase();
          return !h.includes('cover') && !h.includes('toc') && !h.includes('title') &&
                 !h.includes('copyright') && !h.includes('dedication') &&
                 (h.includes('chapter') || h.includes('ch') || h.includes('section') || h.includes('part'));
        });
        /* If no chapter-like entries found, use all TOC entries after cover */
        const finalTocs = chapterTocs.length > 0 ? chapterTocs : toc.filter(t=>!t.href.toLowerCase().includes('cover'));
        /* Map .md files to TOC entries in order */
        const newIndex = {...index};
        mdFiles.forEach((md, i)=>{
          if(i < finalTocs.length){
            newIndex[finalTocs[i].href] = md.file;
          }
        });
        /* Update the index in memory */
        window.__notesIndex = newIndex;
        console.log('[Notes] 自动映射 '+mdFiles.length+' 个章节笔记到 EPUB 目录');
        console.log('[Notes] 映射关系:', newIndex);
      });
    })
    .catch(err=>{
      console.log('[Notes] 自动映射失败:', err.message);
    });
}

function EpubReader({url,title,onBack,embedded,onChapterChange}){
  const areaRef = React.useRef(null);
  const bookRef = React.useRef(null);
  const renditionRef = React.useRef(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [toc, setToc] = React.useState([]);
  const [tocOpen, setTocOpen] = React.useState(false);
  const [pageInfo, setPageInfo] = React.useState('');
  const [currentHref, setCurrentHref] = React.useState('');

  React.useEffect(() => {
    if (!areaRef.current || !url) return;
    let cancelled = false;
    setLoading(true);
    setError(null);

    console.log('[EPUB] Initializing with URL:', url);

    try {
      /* Create book */
      const book = ePub(url);
      bookRef.current = book;

      /* Render with scrolled flow for vertical scrolling */
      const rendition = book.renderTo(areaRef.current, {
        width: '100%',
        height: '100%',
        spread: 'none',
        flow: 'scrolled',
        allowScriptedContent: true
      });
      renditionRef.current = rendition;

      /* Inject CSS into iframe to make content scrollable with visible scrollbar */
      rendition.hooks.content.register(function(contents, view){
        var doc = contents.document;
        if(doc){
          if(doc.documentElement){
            doc.documentElement.style.overflowY = 'auto';
            doc.documentElement.style.height = 'auto';
          }
          if(doc.body){
            doc.body.style.overflowY = 'auto';
            doc.body.style.height = 'auto';
            doc.body.style.minHeight = '100vh';
          }
          /* Add scrollbar styling */
          var style = doc.createElement('style');
          style.textContent = 'html,body{overflow-y:auto !important; height:auto !important} ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-track{background:#f1f1f1} ::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:5px} ::-webkit-scrollbar-thumb:hover{background:#a1a1a1}';
          doc.head.appendChild(style);
        }
      });

      /* Apply theme */
      rendition.themes.register('trading', {
        'body': { background: '#f8f9fb !important', color: '#131722 !important' },
        'a': { color: '#2962ff !important' },
        'p,li,h1,h2,h3,h4,h5,h6,span,div': { color: '#131722 !important' }
      });
      rendition.themes.select('trading');

      /* Load TOC */
      book.ready.then(function(){
        if (cancelled) return;
        console.log('[EPUB] Book ready');
        return book.loaded.navigation;
      }).then(function(nav){
        if (cancelled) return;
        console.log('[EPUB] Navigation loaded');
        const flat = [];
        (function walk(items){
          items.forEach(function(item){
            flat.push({label:item.label.trim(),href:item.href});
            if (item.subitems) walk(item.subitems);
          });
        })(nav.toc);
        setToc(flat);
        window.__epubToc = flat;
        autoMapChaptersToNotes(flat);
      }).catch(function(err){
        if (!cancelled) {
          console.error('[EPUB] TOC error:', err);
          setError('目录加载失败: '+err.message);
        }
      });

      /* Display first page */
      rendition.display().then(function(){
        if (!cancelled) {
          console.log('[EPUB] First page displayed');
          setLoading(false);
        }
      }).catch(function(err){
        if (!cancelled) {
          console.error('[EPUB] Display error:', err);
          /* Try to display first TOC item as fallback */
          if(window.__epubToc && window.__epubToc.length > 0){
            rendition.display(window.__epubToc[0].href).then(function(){
              if(!cancelled) setLoading(false);
            }).catch(function(e2){
              if(!cancelled) {
                setError('EPUB 加载失败: '+e2.message);
                setLoading(false);
              }
            });
          } else {
            setError('EPUB 加载失败: '+err.message);
            setLoading(false);
          }
        }
      });

      /* Track page changes */
      rendition.on('relocated', function(location){
        if (cancelled) return;
        const href = location.start.href;
        setCurrentHref(href);
        const pct = location.start.percentage;
        if (pct != null) {
          setPageInfo(Math.round(pct * 100) + '%');
        }
        if (onChapterChange) onChapterChange(href);
        const tocItem = window.__epubToc && window.__epubToc.find(t=>t.href===href);
        const t = tocItem ? tocItem.label.trim() : '(未知章节)';
        console.log('[EPUB] Relocated:', href, '-', t);
      });

      /* Keyboard nav */
      function handleKey(e){
        if (e.key === 'ArrowLeft') rendition.prev();
        else if (e.key === 'ArrowRight') rendition.next();
        else if (e.key === 'Escape') onBack && onBack();
      }
      window.addEventListener('keydown', handleKey);

      return function cleanup(){
        cancelled = true;
        window.removeEventListener('keydown', handleKey);
        if (renditionRef.current) { try{renditionRef.current.destroy();}catch(e){} }
        if (bookRef.current) { try{bookRef.current.destroy();}catch(e){} }
        bookRef.current = null;
        renditionRef.current = null;
      };
    } catch(err) {
      console.error('[EPUB] Init error:', err);
      setError('EPUB 初始化失败: '+err.message);
      setLoading(false);
    }
  }, [url]);

  function goPrev(){ if(renditionRef.current) renditionRef.current.prev(); }
  function goNext(){ if(renditionRef.current) renditionRef.current.next(); }
  function goToChapter(href){
    if(renditionRef.current){
      renditionRef.current.display(href);
      setTocOpen(false);
    }
  }

  if(error) return (
    <div className={embedded?'':'screen'}>
      <div className="epub-reader" style={embedded?{maxWidth:'none'}:{}}>
        <div className="epub-toolbar">
          {!embedded && <button onClick={onBack}>← 返回</button>}
          <span className="epub-title">{title}</span>
        </div>
        <div className="epub-error">
          <p>⚠️ {error}</p>
          <p style={{marginTop:12,fontSize:12,color:'var(--text2)'}}>
            请确认 EPUB 文件已放在仓库的 books/ 目录下，并已推送到 GitHub。
          </p>
          {!embedded && <button onClick={onBack} style={{marginTop:16}}>← 返回</button>}
        </div>
      </div>
    </div>
  );

  return (
    <div className={embedded?'':'screen'} style={embedded?{}:{padding:0}}>
      <div className="epub-reader" style={embedded?{maxWidth:'none'}:{}}>
        <div className="epub-toolbar">
          {!embedded && <button onClick={onBack}>← 返回</button>}
          <button onClick={()=>setTocOpen(!tocOpen)}>☰ 目录</button>
          <span className="epub-title">{title}</span>
          <span className="page-info">{pageInfo}</span>
          <button onClick={goPrev}>◀ 上一页</button>
          <button onClick={goNext}>下一页 ▶</button>
        </div>
        <div className="epub-viewer" style={{position:'relative'}}>
          {loading && <div className="epub-loading"><div className="spinner"></div><p>正在加载电子书...</p></div>}
          <div ref={areaRef} id="epubArea" style={{visibility: loading?'hidden':'visible'}}/>
          {tocOpen && toc.length>0 && (
            <div className="epub-toc open">
              <h3>📖 目录</h3>
              {toc.map((ch,i)=>(
                <div key={i}
                  className={'epub-toc-item'+(ch.href===currentHref?' active':'')}
                  onClick={()=>goToChapter(ch.href)}>
                  {ch.label}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PdfReader({url,title,onBack,embedded}){
  const wrapRef = React.useRef(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [pages, setPages] = React.useState([]);
  const [totalPages, setTotalPages] = React.useState(0);
  const [currentPage, setCurrentPage] = React.useState(1);
  const [scale, setScale] = React.useState(1.2);
  const pdfDocRef = React.useRef(null);

  React.useEffect(()=>{
    if(!url) return;
    let cancelled = false;
    setLoading(true);
    setError(null);

    /* Set worker source */
    if(window.pdfjsLib){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    window.pdfjsLib.getDocument(url).promise.then(function(pdf){
      if(cancelled) return;
      pdfDocRef.current = pdf;
      setTotalPages(pdf.numPages);
      /* Render all pages */
      const canvasEls = [];
      for(let i=1; i<=pdf.numPages; i++){
        canvasEls.push(i);
      }
      setPages(canvasEls);
      setLoading(false);
      /* Render each page */
      for(let i=1; i<=pdf.numPages; i++){
        (function(num){
          pdf.getPage(num).then(function(page){
            if(cancelled) return;
            const viewport = page.getViewport({scale: scale});
            const canvas = document.getElementById('pdf-page-'+num);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            page.render({canvasContext: ctx, viewport: viewport});
          });
        })(i);
      }
    }).catch(function(err){
      if(!cancelled){ setError('PDF 加载失败: '+err.message); setLoading(false); }
    });

    return function(){ cancelled = true; };
  },[url]);

  /* Re-render when scale changes */
  React.useEffect(()=>{
    const pdf = pdfDocRef.current;
    if(!pdf || pages.length===0) return;
    for(let i=1; i<=pages.length; i++){
      (function(num){
        pdf.getPage(num).then(function(page){
          const viewport = page.getViewport({scale: scale});
          const canvas = document.getElementById('pdf-page-'+num);
          if(!canvas) return;
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          page.render({canvasContext: ctx, viewport: viewport});
        });
      })(i);
    }
  },[scale]);

  /* Track scroll position for current page */
  React.useEffect(()=>{
    const wrap = wrapRef.current;
    if(!wrap) return;
    function onScroll(){
      const canvases = wrap.querySelectorAll('canvas');
      let best = 1;
      for(let i=0; i<canvases.length; i++){
        const rect = canvases[i].getBoundingClientRect();
        if(rect.top < window.innerHeight * 0.5){
          best = i+1;
        }
      }
      setCurrentPage(best);
    }
    wrap.addEventListener('scroll', onScroll);
    return ()=>{ wrap.removeEventListener('scroll', onScroll); };
  },[pages.length]);

  function zoomIn(){ setScale(s=>Math.min(3, s+0.2)); }
  function zoomOut(){ setScale(s=>Math.max(0.4, s-0.2)); }
  function scrollToPage(n){
    const el = document.getElementById('pdf-page-'+n);
    if(el && wrapRef.current) wrapRef.current.scrollTo({top: el.offsetTop - 8, behavior:'smooth'});
  }

  if(error) return (
    <div className={embedded?'':'screen'}>
      <div className="pdf-reader" style={embedded?{maxWidth:'none'}:{}}>
        <div className="pdf-toolbar">
          {!embedded && <button onClick={onBack}>← 返回</button>}
          <span className="pdf-title">{title}</span>
        </div>
        <div className="pdf-error">
          <p>⚠️ {error}</p>
          <p style={{marginTop:12,fontSize:12,color:'var(--text2)'}}>请确认 PDF 文件已放在仓库的 books/ 目录下。</p>
          {!embedded && <button onClick={onBack} style={{marginTop:16}}>← 返回</button>}
        </div>
      </div>
    </div>
  );

  return (
    <div className={embedded?'':'screen'} style={embedded?{}:{padding:0}}>
      <div className="pdf-reader" style={embedded?{maxWidth:'none'}:{}}>
        <div className="pdf-toolbar">
          {!embedded && <button onClick={onBack}>← 返回</button>}
          <button onClick={zoomOut}>−</button>
          <span className="zoom-info">{Math.round(scale*100)+'%'}</span>
          <button onClick={zoomIn}>+</button>
          <span className="pdf-title">{title}</span>
          <span className="page-info">{currentPage} / {totalPages}</span>
          <button onClick={()=>scrollToPage(Math.max(1,currentPage-1))}>◀ 上页</button>
          <button onClick={()=>scrollToPage(Math.min(totalPages,currentPage+1))}>下页 ▶</button>
        </div>
        <div className="pdf-canvas-wrap" ref={wrapRef}>
          {loading && <div className="pdf-loading"><div className="spinner"></div><p>正在加载 PDF...</p></div>}
          {pages.map(n=>(
            <canvas key={n} id={'pdf-page-'+n}/>
          ))}
        </div>
      </div>
    </div>
  );
}

function TxtReader({url,title,onBack,embedded}){

  React.useEffect(()=>{
    if(!url) return;
    let cancelled = false;
    setLoading(true);
    fetch(url)
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})

      .catch(err=>{if(!cancelled){setError('文件加载失败: '+err.message);setLoading(false);}});

  if(error) return (

function LearningReader({item,onBack}){
  const [leftW, setLeftW] = React.useState(55);
  const [dragging, setDragging] = React.useState(false);
  const [currentChapter, setCurrentChapter] = React.useState('');
  const [chapterTitle, setChapterTitle] = React.useState('');
  const [notesHtml, setNotesHtml] = React.useState(item.content || '');
  const [notesIndex, setNotesIndex] = React.useState(null);
  const [loadingNotes, setLoadingNotes] = React.useState(false);
  const containerRef = React.useRef(null);

  /* Fetch notes index for this book */
  React.useEffect(()=>{
    if(!item.id || !item.file) return;
    window.__currentBookId = item.id; /* Set current book for auto-mapping */
    setLoadingNotes(true);
    fetch('notes/'+item.id+'/index.json')
      .then(r=>r.ok?r.json():null)
      .then(data=>{
        setNotesIndex(data);
        setLoadingNotes(false);
      })
      .catch(()=>{
        setNotesIndex(null);
        setLoadingNotes(false);
      });
  },[item.id]);

  /* Fetch and render notes for current chapter */
  React.useEffect(()=>{
    if(!currentChapter){
      setNotesHtml(item.content || '');
      return;
    }
    /* Use auto-mapped index if available, otherwise use fetched index */
    const idx = window.__notesIndex || notesIndex;
    if(!idx){
      if(!notesIndex) return; /* Still loading */
      setNotesHtml('<h3>📝 本章笔记</h3><p>本章笔记尚未编写。</p><p style="color:var(--text2);font-size:13px;margin-top:12px;">你可以在仓库的 <code>notes/'+item.id+'/</code> 目录下添加对应的 Markdown 文件。</p>');
      return;
    }
    const mdFile = idx[currentChapter];
    if(!mdFile){
      /* No mapping for this chapter */
      setNotesHtml('<h3>📝 本章笔记</h3><p>本章笔记尚未编写。</p><p style="color:var(--text2);font-size:13px;margin-top:12px;">你可以在仓库的 <code>notes/'+item.id+'/</code> 目录下添加对应的 Markdown 文件。</p>');
      return;
    }
    setLoadingNotes(true);
    fetch('notes/'+item.id+'/'+mdFile)
      .then(r=>r.ok?r.text():null)
      .then(md=>{
        if(md){
          setNotesHtml(mdToHtml(md));
        } else {
          setNotesHtml('<h3>📝 本章笔记</h3><p>笔记文件加载失败: '+mdFile+'</p>');
        }
        setLoadingNotes(false);
      })
      .catch(()=>{
        setNotesHtml('<h3>📝 本章笔记</h3><p>笔记文件加载失败。</p>');
        setLoadingNotes(false);
      });
  },[currentChapter, notesIndex]);

  React.useEffect(()=>{
    if(!dragging) return;
    function onMove(e){
      const el = containerRef.current;
      if(!el) return;
      const rect = el.getBoundingClientRect();
      const pct = ((e.clientX - rect.left) / rect.width) * 100;
      setLeftW(Math.min(80, Math.max(25, pct)));
    }
    function onUp(){ setDragging(false); }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
    return ()=>{
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    };
  },[dragging]);

  function getFormat(file){
    if(!file) return null;
    const ext = file.split('.').pop().toLowerCase();
    if(ext==='epub') return 'epub';
    if(ext==='pdf') return 'pdf';
    if(ext==='txt') return 'txt';
    return null;
  }

  function handleChapterChange(href){
    setCurrentChapter(href);
    /* Try to find TOC label for this href */
    if(window.__epubToc && window.__epubToc.length){
      const ch = window.__epubToc.find(t=>t.href===href);
      if(ch) setChapterTitle(ch.label.trim());
      else setChapterTitle('');
    }
  }

  function renderReader(item){
    const fmt = getFormat(item.file);
    if(fmt==='epub') return <EpubReader url={item.file} title={item.name} embedded={true} onBack={onBack} onChapterChange={handleChapterChange} />;
    if(fmt==='pdf') return <PdfReader url={item.file} title={item.name} embedded={true} onBack={onBack}/>;
    if(fmt==='txt') return <TxtReader url={item.file} title={item.name} embedded={true} onBack={onBack}/>;
    return null;
  }

  if(item.file){
    const isChapterMode = !!currentChapter;
    return (
      <div style={{height:'100vh',overflow:'hidden'}}>
        <div className="book-split" ref={containerRef}>
          <div className="book-pane" style={{width:leftW+'%'}}>
            {renderReader(item)}
          </div>
          <div className={'book-divider'+(dragging?' dragging':'')} onMouseDown={(e)=>{e.preventDefault();setDragging(true);}}>
            <div className="divider-line"/>
          </div>
          <div className="book-pane book-pane-right" style={{width:(100-leftW)+'%'}}>
            <div className="learn-reader-head">
              <button className="back" onClick={onBack}>← 返回</button>
              <span className="learn-reader-title">
                {isChapterMode ? '📖 ' + (chapterTitle || '本章笔记') : '📝 知识要点'}
              </span>
              {loadingNotes && <span style={{fontSize:11,color:'var(--text2)',marginLeft:8}}>加载中...</span>}
            </div>
            <div className="learn-reader-body" dangerouslySetInnerHTML={{__html:notesHtml}}/>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="screen">
      <div className="learn-reader">
        <div className="learn-reader-head">
          <button className="back" onClick={onBack}>← 返回</button>
          <span className="learn-reader-title">{item.icon} {item.name}</span>
        </div>
        <div className="learn-reader-body" dangerouslySetInnerHTML={{__html:item.content}}/>
      </div>
    </div>
  );
}

function App(){
  const [state, setState] = useState(getInitialState);

  const persist = useCallback((s)=>{
    saveSave({xp:s.xp, stars:s.stars, unlocked:s.unlocked, wrong:s.wrong, achievements:s.achievements,
      dailyStreak:s.dailyStreak, dailyLastDate:s.dailyLastDate, chapterCert:s.chapterCert});
  },[]);

  // Auto-dismiss achievement toast
  useEffect(()=>{
    if(state.toast){
      const t=setTimeout(()=>setState(s=>({...s,toast:null})),3200);
      return ()=>clearTimeout(t);
    }
  },[state.toast]);

  const handleStart = ()=>{
    setState(s=>({...s, screen:'map'}));
  };

  const handleSelectLevel = (ci,li)=>{
    setState(s=>({...s, screen:'level', chapter:ci, level:li, qIdx:0, answered:false, selected:-1, correctCount:0, streak:0}));
  };

  const handleAnswer = (idx)=>{
    setState(s=>{
      const ch = CHAPTERS[s.chapter];
      const lv = ch.levels[s.level];
      const q = lv.questions[s.qIdx];
      const correct = idx===q.ans;
      const streak = correct ? (s.streak+1) : 0;
      const wrong = {...s.wrong};
      if(!correct) wrong[`${s.chapter}-${s.level}-${s.qIdx}`] = true;
      const ev = evalProgressAchievements({...s, streak});
      const toast = ev.newly.length ? ev.newly[ev.newly.length-1] : s.toast;
      const newState = {...s, answered:true, selected:idx, correctCount:s.correctCount+(correct?1:0), streak, wrong, achievements:ev.achievements, toast};
      persist(newState);
      return newState;
    });
  };

  const handleNext = ()=>{
    setState(s=>{
      const ch = CHAPTERS[s.chapter];
      const lv = ch.levels[s.level];
      if(s.qIdx < lv.questions.length - 1){
        return {...s, qIdx:s.qIdx+1, answered:false, selected:-1};
      } else {
        // Level complete
        const total = lv.questions.length;
        const rating = s.correctCount===total?3:s.correctCount>=total*0.7?2:s.correctCount>=total*0.4?1:0;
        const xpEarned = s.correctCount * 20 + rating * 10;
        const key = `${s.chapter}-${s.level}`;
        const newStars = {...s.stars};
        newStars[key] = Math.max(newStars[key]||0, rating);
        const newUnlocked = {...s.unlocked};
        // Unlock next level
        if(s.level < ch.levels.length - 1){
          newUnlocked[`${s.chapter}-${s.level+1}`] = true;
        } else if(s.chapter < CHAPTERS.length - 1){
          newUnlocked[`${s.chapter+1}-0`] = true;
        }
        const xpNow = s.xp + xpEarned;
        const ev = evalProgressAchievements({...s, stars:newStars, xp:xpNow});
        const toast = ev.newly.length ? ev.newly[ev.newly.length-1] : s.toast;
        const screen = ev.newly.includes('all_clear') ? 'cert' : 'result';
        const newState = {...s, screen, stars:newStars, unlocked:newUnlocked, xp:xpNow, achievements:ev.achievements, toast};
        persist(newState);
        return newState;
      }
    });
  };

  const handleRetry = ()=>{
    setState(s=>({...s, screen:'level', qIdx:0, answered:false, selected:-1, correctCount:0, streak:0}));
  };

  const handleNextLevel = ()=>{
    setState(s=>{
      const ch = CHAPTERS[s.chapter];
      if(s.level < ch.levels.length - 1){
        return {...s, screen:'level', level:s.level+1, qIdx:0, answered:false, selected:-1, correctCount:0, streak:0};
      } else if(s.chapter < CHAPTERS.length - 1){
        return {...s, screen:'level', chapter:s.chapter+1, level:0, qIdx:0, answered:false, selected:-1, correctCount:0, streak:0};
      }
      return {...s, screen:'map'};
    });
  };

  const handleBack = ()=>{
    setState(s=>({...s, screen:'map'}));
  };

  /* --- Modal / Review handlers --- */
  const handleOpenWrong = ()=> setState(s=>({...s, screen:'wrong'}));
  const handleOpenAch = ()=> setState(s=>({...s, screen:'ach'}));
  const handleOpenCert = ()=> setState(s=>({...s, screen:'cert'}));
  const handleCloseModal = ()=> setState(s=>({...s, screen:'map'}));

  const handlePracticeWrong = (k)=>{
    setState(s=>{
      const queue = (k===null) ? Object.keys(s.wrong) : [k];
      if(queue.length===0) return s;
      let ach = {...s.achievements};
      let toast = s.toast;
      if(!ach['review_first']){ ach['review_first']=Date.now(); toast='review_first'; }
      return {...s, screen:'review', reviewQueue:queue, reviewIdx:0, answered:false, selected:-1, achievements:ach, toast};
    });
  };

  const handleReviewAnswer = (idx)=>{
    setState(s=>{
      const key = s.reviewQueue[s.reviewIdx];
      if(key==null) return s;
      const [ci,li,qi] = key.split('-').map(Number);
      const q = CHAPTERS[ci].levels[li].questions[qi];
      const correct = idx===q.ans;
      const wrong = {...s.wrong};
      let ach = {...s.achievements};
      let toast = s.toast;
      let xp = s.xp;
      if(correct){
        delete wrong[key];
        if(!ach['comeback']){ ach['comeback']=Date.now(); toast='comeback'; }
        xp += 5;
      }
      const newState = {...s, answered:true, selected:idx, wrong, achievements:ach, toast, xp};
      persist(newState);
      return newState;
    });
  };

  const handleReviewNext = ()=>{
    setState(s=>{
      const ni = s.reviewIdx + 1;
      if(ni >= s.reviewQueue.length) return {...s, screen:'wrong', reviewIdx:0, answered:false, selected:-1};
      return {...s, reviewIdx:ni, answered:false, selected:-1};
    });
  };

  /* --- Daily Drill handlers --- */
  const handleOpenDaily = ()=> setState(s=>{
    const today=todayStr();
    let daily=s.daily;
    if(!daily||daily.date!==today||!daily.set||!daily.set.length){
      daily={date:today,idx:0,results:[],answered:false,selected:-1,set:buildDailySet(Object.keys(s.wrong)),done:false};
    }
    return {...s, screen:'daily', daily};
  });
  const handleDailyAnswer = (idx)=> setState(s=>{
    if(s.screen!=='daily'||s.daily.answered) return s;
    const q=QUESTION_BANK[s.daily.set[s.daily.idx]].q;
    const correct=idx===q.ans;
    const results=[...s.daily.results]; results[s.daily.idx]={correct,selected:idx};
    return {...s, daily:{...s.daily, answered:true, selected:idx, results}};
  });
  const handleDailyNext = ()=> setState(s=>{
    if(s.screen!=='daily') return s;
    const ni=s.daily.idx+1;
    if(ni<s.daily.set.length) return {...s, daily:{...s.daily, idx:ni, answered:false, selected:-1}};
    const correct=s.daily.results.filter(r=>r&&r.correct).length;
    const xp=s.xp+correct*5;
    const today=todayStr();
    let streak=s.dailyStreak||0;
    if(s.dailyLastDate!==today) streak=(s.dailyLastDate===yesterdayStr())?streak+1:1;
    const ach={...s.achievements}; let toast=s.toast;
    if(!ach['daily_first']){ach['daily_first']=Date.now();toast='daily_first';}
    if(streak>=7&&!ach['daily7']){ach['daily7']=Date.now();toast='daily7';}
    const newState={...s, xp, dailyStreak:streak, dailyLastDate:today, achievements:ach, toast,
      daily:{...s.daily, answered:true, selected:-1, done:true}};
    persist(newState);
    return newState;
  });
  const handleDailyExit = ()=> setState(s=>({...s, screen:'map'}));

  /* --- Chapter Checkpoint handlers --- */
  const handleOpenCheckpoint = (ci)=> setState(s=>{
    const ch=CHAPTERS[ci];
    const allDone=ch.levels.every((_,li)=>s.stars[`${ci}-${li}`]);
    if(!allDone) return s;
    const bank=QUESTION_BANK.map((b,i)=>({b,i})).filter(x=>x.b.ci===ci);
    const rnd=mulberry32(hashStr('cp-'+ci+'-'+Object.keys(s.stars).length+'-'+(Date.now()%997)));
    const set=[];const used=new Set();
    const n=Math.min(5,bank.length);
    while(set.length<n){const k=Math.floor(rnd()*bank.length);if(!used.has(k)){used.add(k);set.push(bank[k].i);}}
    return {...s, screen:'checkpoint', cp:{ci,idx:0,results:[],answered:false,selected:-1,set,done:false,passed:false}};
  });
  const handleCheckpointAnswer = (idx)=> setState(s=>{
    if(s.screen!=='checkpoint'||s.cp.answered) return s;
    const q=QUESTION_BANK[s.cp.set[s.cp.idx]].q;
    const correct=idx===q.ans;
    const results=[...s.cp.results]; results[s.cp.idx]={correct,selected:idx};
    return {...s, cp:{...s.cp, answered:true, selected:idx, results}};
  });
  const handleCheckpointNext = ()=> setState(s=>{
    if(s.screen!=='checkpoint') return s;
    const ni=s.cp.idx+1;
    if(ni<s.cp.set.length) return {...s, cp:{...s.cp, idx:ni, answered:false, selected:-1}};
    const total=s.cp.set.length;
    const correct=s.cp.results.filter(r=>r&&r.correct).length;
    const passed=correct>=Math.ceil(total*0.8);
    if(passed){
      const chapterCert={...s.chapterCert,[s.cp.ci]:Date.now()};
      const ach={...s.achievements}; let toast=s.toast;
      if(!ach['chapter_cert']){ach['chapter_cert']=Date.now();toast='chapter_cert';}
      if(Object.keys(chapterCert).length>=CHAPTERS.length && !ach['all_chapter_cert']){ach['all_chapter_cert']=Date.now();toast='all_chapter_cert';}
      const newState={...s, xp:s.xp+30, chapterCert, achievements:ach, toast, cp:{...s.cp, done:true, passed:true}};
      persist(newState);
      return newState;
    }
    return {...s, cp:{...s.cp, done:true, passed:false}};
  });

  /* --- Codex / Path handlers --- */
  const handleOpenCodex = ()=> setState(s=>{
    const ach={...s.achievements}; let toast=s.toast;
    if(!ach['codex_view']){ach['codex_view']=Date.now();toast='codex_view';}
    return {...s, screen:'codex', codexViewed:true, achievements:ach, toast};
  });
  const handleOpenPath = ()=> setState(s=>({...s, screen:'path'}));
  const handleOpenLearn = ()=> setState(s=>({...s, screen:'learn'}));
  const handleOpenLearnItem = (item)=> setState(s=>({...s, screen:'learnReader', learnItem:item}));
  const handleBackToLearn = ()=> setState(s=>({...s, screen:'learn', learnItem:null}));

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {state.screen!=='welcome' && (
        <div className="header">
          <h1>认真交易</h1>
          <div className="xp-bar">
            <span>XP {state.xp}</span>
            <div className="bar"><div className="fill" style={{width:Math.min(100,(state.xp%500)/5)+'%'}}></div></div>
            <span>Lv.{Math.floor(state.xp/500)+1}</span>
          </div>
        </div>
      )}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {state.screen!=='welcome' && (
          <Sidebar state={state}
            onOpenDaily={handleOpenDaily}
            onOpenCodex={handleOpenCodex}
            onOpenPath={handleOpenPath}
            onOpenWrong={handleOpenWrong}
            onOpenAch={handleOpenAch}
            onOpenCert={handleOpenCert}
            onOpenLearn={handleOpenLearn}/>
        )}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {state.screen==='welcome' && <Welcome onStart={handleStart}/>}
          {['map','wrong','ach'].includes(state.screen) && (
            <GameMap state={state}
              onSelectLevel={handleSelectLevel}
              onOpenWrong={handleOpenWrong}
              onOpenAch={handleOpenAch}
              onOpenCert={handleOpenCert}
              onOpenDaily={handleOpenDaily}
              onOpenCodex={handleOpenCodex}
              onOpenPath={handleOpenPath}
              onOpenCheckpoint={handleOpenCheckpoint}/>
          )}
      {state.screen==='level' && <LevelScreen state={state} onAnswer={handleAnswer} onNext={handleNext} onBack={handleBack}/>}
      {state.screen==='result' && <ResultScreen state={state} onRetry={handleRetry} onNext={handleNextLevel} onMap={handleBack}/>}
      {state.screen==='wrong' && <WrongBook state={state} onClose={handleCloseModal} onPractice={handlePracticeWrong}/>}
      {state.screen==='ach' && <Achievements state={state} onClose={handleCloseModal}/>}
      {state.screen==='review' && <ReviewScreen state={state} onAnswer={handleReviewAnswer} onNext={handleReviewNext} onExit={()=>setState(s=>({...s,screen:'wrong'}))}/>}
      {state.screen==='cert' && <Certificate state={state} onClose={handleCloseModal}/>}
      {state.screen==='daily' && <DailyDrill state={state} onAnswer={handleDailyAnswer} onNext={handleDailyNext} onExit={handleDailyExit}/>}
      {state.screen==='codex' && <PatternCodex onClose={handleCloseModal}/>}
      {state.screen==='path' && <LearningPath state={state} onClose={handleCloseModal}/>}
      {state.screen==='learn' && <LearningHub onBack={handleBack} onOpenItem={handleOpenLearnItem}/>}
      {state.screen==='learnReader' && state.learnItem && <LearningReader item={state.learnItem} onBack={handleBackToLearn}/>}
      {state.screen==='checkpoint' && <ChapterCheckpoint state={state} onAnswer={handleCheckpointAnswer} onNext={handleCheckpointNext} onExit={handleCloseModal} onRetry={()=>handleOpenCheckpoint(state.cp.ci)}/>}
      {state.toast && <Toast ach={state.toast}/>}
        </div>
      </div>
    </div>
  );}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
