/* ========== CHART RENDERER ========== */
function drawChart(canvas, candles, opts={}){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const pad={t:16,b:16,l:8,r:42};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;

  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#ffffff');bgGrad.addColorStop(1,'#f8f9fb');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){let y=pad.t+cH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke()}

  if(!candles||!candles.length)return;
  let allH=Math.max(...candles.map(c=>c.h));
  let allL=Math.min(...candles.map(c=>c.l));
  let range=allH-allL||1;
  allH+=range*.1;allL-=range*.1;range=allH-allL;

  const n=candles.length;
  const gap=opts.gap||Math.max(4,cW/(n*2));
  const bw=(cW-gap*(n+1))/n;

  ctx.fillStyle='rgba(0,0,0,.35)';ctx.font='9px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){
    const price=allH-(range*i/4);
    const y=pad.t+cH*i/4;
    ctx.fillText(price.toFixed(1),W-pad.r+4,y+3);
  }

  candles.forEach((c,i)=>{
    const x=pad.l+gap+i*(bw+gap);
    const yH=pad.t+((allH-c.h)/range)*cH;
    const yL=pad.t+((allH-c.l)/range)*cH;
    const yO=pad.t+((allH-c.o)/range)*cH;
    const yC=pad.t+((allH-c.c)/range)*cH;
    const bull=c.c>=c.o;
    const color=bull?'#26a69a':'#ef5350';
    const top=Math.min(yO,yC);
    const bH=Math.max(Math.abs(yO-yC),2);

    ctx.save();
    ctx.shadowColor=color;ctx.shadowBlur=6;
    ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,bw*.12);
    ctx.beginPath();ctx.moveTo(x+bw/2,yH);ctx.lineTo(x+bw/2,yL);ctx.stroke();
    ctx.restore();

    const bodyGrad=ctx.createLinearGradient(0,top,0,top+bH);
    if(bull){
      bodyGrad.addColorStop(0,'#26a69a');bodyGrad.addColorStop(1,'#1e8c82');
    }else{
      bodyGrad.addColorStop(0,'#ef5350');bodyGrad.addColorStop(1,'#d63d3a');
    }
    ctx.fillStyle=bodyGrad;
    ctx.shadowColor=color;ctx.shadowBlur=3;
    ctx.fillRect(x,top,bw,bH);
    ctx.shadowBlur=0;

    if(opts.highlight===i){
      ctx.save();
      ctx.shadowColor=color;ctx.shadowBlur=16;
      ctx.strokeStyle=color;ctx.lineWidth=2;
      ctx.strokeRect(x-3,top-3,bw+6,bH+6);
      ctx.restore();
    }
  });
}

/* ========== CONSTANTS & ACHIEVEMENTS ========== */

const ACH_DEFS = [
  {id:'first_clear',  icon:'🌱', name:'初出茅庐', desc:'完成你的第一关'},
  {id:'ten_clear',    icon:'🌿', name:'渐入佳境', desc:'累计完成 10 关'},

  {id:'first_perfect',icon:'⭐', name:'首战告捷', desc:'获得首个 3 星评价'},
  {id:'all_perfect',  icon:'💎', name:'完美主义', desc:'全部关卡达成 3 星'},
  {id:'combo5',       icon:'🔥', name:'火眼金睛', desc:'连续答对 5 题'},
  {id:'combo10',      icon:'🌟', name:'明察秋毫', desc:'连续答对 10 题'},
  {id:'review_first', icon:'📖', name:'温故知新', desc:'首次复习错题'},
  {id:'comeback',     icon:'💪', name:'百折不挠', desc:'在错题本中改对一道错题'},
  {id:'daily_first',  icon:'📅', name:'打卡新人', desc:'完成首次每日一练'},

  {id:'chapter_cert', icon:'🎯', name:'章节认证', desc:'通过首个章节认证考'},
  {id:'all_chapter_cert',icon:'🏛️', name:'全科认证', desc:'通过全部章节认证考'},
  {id:'codex_view',   icon:'📚', name:'图鉴通鉴', desc:'浏览形态图鉴'},
];

function evalProgressAchievements(s){
  const ach = {...s.achievements};
  const newly = [];
  const completed = Object.keys(s.stars).length;
  const perfect = Object.values(s.stars).filter(v=>v===3).length;
  const unlock = (id)=>{ if(!ach[id]){ ach[id]=Date.now(); newly.push(id); } };
  if(completed>=1) unlock('first_clear');
  if(completed>=10) unlock('ten_clear');
  if(completed>=Math.ceil(TOTAL_LEVELS/2)) unlock('half_clear');
  if(completed>=TOTAL_LEVELS) unlock('all_clear');
  if(perfect>=1) unlock('first_perfect');
  if(perfect>=TOTAL_LEVELS) unlock('all_perfect');
  if(s.streak>=5) unlock('combo5');
  if(s.streak>=10) unlock('combo10');
  return {achievements:ach, newly};
}

/* ========== DRILL DATA HELPERS ========== */
function buildQuestionBank(){
  const bank=[];
  CHAPTERS.forEach((ch,ci)=>ch.levels.forEach((lv,li)=>lv.questions.forEach((q,qi)=>bank.push({ci,li,qi,q,chName:ch.name,lvName:lv.name}))));
  return bank;
}
const QUESTION_BANK = buildQuestionBank();

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

function buildDailySet(wrongKeys){
  const rnd=mulberry32(hashStr('daily-'+todayStr()));
  const set=[];const used=new Set();
  for(const k of (wrongKeys||[])){
    if(set.length>=5) break;
    const [ci,li,qi]=k.split('-').map(Number);
    const idx=QUESTION_BANK.findIndex(b=>b.ci===ci&&b.li===li&&b.qi===qi);
    if(idx>=0&&!used.has(idx)){used.add(idx);set.push(idx);}
  }
  while(set.length<5){ const idx=Math.floor(rnd()*QUESTION_BANK.length); if(!used.has(idx)){used.add(idx);set.push(idx);} }
  return set;
}

/* ========== STATE HELPERS ========== */
function getState(){
  const saved = loadSave();
  if(saved) return saved;
  return {xp:0, stars:{}, unlocked:{}, wrong:{}, achievements:{}, streak:0,
    dailyStreak:0, dailyLastDate:'', chapterCert:{}};
}

function persistState(s){
  saveSave({xp:s.xp, stars:s.stars, unlocked:s.unlocked, wrong:s.wrong, achievements:s.achievements,
    dailyStreak:s.dailyStreak, dailyLastDate:s.dailyLastDate, chapterCert:s.chapterCert});
}

/* ========== COMPONENTS ========== */

function CandleChart({candles,highlight,label}){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && candles){
      const dpr = window.devicePixelRatio||1;
      const rect = ref.current.getBoundingClientRect();
      ref.current.width = rect.width * dpr;
      ref.current.height = (rect.height || 200) * dpr;
      ref.current.getContext('2d').scale(dpr,dpr);
      ref.current.style.width = rect.width+'px';
      drawChart(ref.current, candles, {highlight, label, gap:Math.max(6,rect.width/(candles.length*2.5))});
    }
  },[candles,highlight,label]);
  return (
    <div className="chart-container">
      <canvas ref={ref} style={{width:'100%',height:'200px'}} />
    </div>
  );
}

function DailyDrill({state,onAnswer,onNext}){
  const d=state.daily;
  const keys=['A','B','C','D'];
  if(!d||!d.set.length) return <div className="screen"><div className="empty">今日题目加载中...</div></div>;
  if(d.done){
    const correct=d.results.filter(r=>r&&r.correct).length;
    const total=d.set.length;
    return (
      <div className="screen"><div className="result-screen">
        <div style={{fontSize:50}}>📅</div>
        <div className="result-title" style={{color:'var(--gold)'}}>今日一练完成！</div>
        <div className="result-stars">{correct}/{total} 答对</div>
        <div className="result-xp">+{correct*5} XP</div>
        <div className="result-score">连续打卡 {state.dailyStreak} 天</div>
        <div className="result-btns">
          <a href="index.html" className="btn-map" style={{padding:'12px 24px',borderRadius:6,fontSize:14,fontWeight:'bold',border:'1px solid var(--purple)',color:'var(--purple)',background:'#fff',textDecoration:'none',display:'inline-block'}}>返回地图</a>
        </div>
      </div></div>
    );
  }
  const q=QUESTION_BANK[d.set[d.idx]].q;
  const total=d.set.length;
  const getOC=(idx)=>{
    if(!d.answered) return d.selected===idx?'option-btn selected':'option-btn';
    if(idx===q.ans) return 'option-btn correct';
    if(idx===d.selected&&idx!==q.ans) return 'option-btn wrong';
    return 'option-btn';
  };
  return (
    <div className="screen"><div className="level-screen">
      <div className="level-header">
        <a href="index.html" className="back-btn">← 返回</a>
        <span className="level-name">📅 每日一练</span>
        <span style={{fontFamily:'var(--pixel)',fontSize:9,color:'var(--text2)'}}>{d.idx+1}/{total}</span>
      </div>
      <div className="progress-bar"><div className="fill" style={{width:((d.idx+(d.answered?1:0))/total)*100+'%'}}/></div>
      <CandleChart candles={q.candles} highlight={q.highlight}/>
      <div className="question-box">
        <div className="question-type">{q.type==='tf'?'判断题':'选择题'}</div>
        <div className="question-text">{q.q}</div>
        <div className="options">
          {q.opts.map((opt,idx)=>(
            <button key={idx} className={getOC(idx)} onClick={()=>!d.answered&&onAnswer(idx)} disabled={d.answered}>
              <span className="key">{keys[idx]}</span><span>{opt}</span>
            </button>
          ))}
        </div>
        {d.answered && <div className="explanation"><strong>{d.selected===q.ans?'✓ 回答正确！':'✗ 回答错误'}</strong><br/>{q.explain}</div>}
      </div>
      {d.answered && (
        <button className={d.idx<total-1?'next-btn':'submit-btn'} onClick={onNext}
          style={{color:'#fff'}}>
          {d.idx<total-1?'下一题 →':'完成今日一练 🎉'}
        </button>
      )}
    </div></div>
  );
}

/* ========== APP ========== */
function App(){
  const [state, setState] = useState(()=>{
    const s = getState();
    const today = todayStr();
    let daily = s.daily;
    if(!daily || daily.date !== today || !daily.set || !daily.set.length){
      daily = {date:today, idx:0, results:[], answered:false, selected:-1, set:buildDailySet(Object.keys(s.wrong||{})), done:false};
    }
    return {...s, daily};
  });

  const [toast, setToast] = useState(null);

  useEffect(()=>{
    if(toast){
      const t = setTimeout(()=>setToast(null), 3200);
      return ()=>clearTimeout(t);
    }
  },[toast]);

  const handleAnswer = (idx) => {
    setState(s => {
      if(s.daily.answered) return s;
      const q = QUESTION_BANK[s.daily.set[s.daily.idx]].q;
      const correct = idx === q.ans;
      const results = [...s.daily.results];
      results[s.daily.idx] = {correct, selected:idx};
      return {...s, daily:{...s.daily, answered:true, selected:idx, results}};
    });
  };

  const handleNext = () => {
    setState(s => {
      const ni = s.daily.idx + 1;
      if(ni < s.daily.set.length){
        return {...s, daily:{...s.daily, idx:ni, answered:false, selected:-1}};
      }
      // Daily complete
      const correct = s.daily.results.filter(r=>r&&r.correct).length;
      const xp = (s.xp||0) + correct * 5;
      const today = todayStr();
      let streak = s.dailyStreak || 0;
      if(s.dailyLastDate !== today){
        streak = (s.dailyLastDate === yesterdayStr()) ? streak + 1 : 1;
      }
      const ach = {...(s.achievements||{})};
      let newToast = toast;
      if(!ach['daily_first']){ach['daily_first']=Date.now(); newToast='daily_first';}
      if(streak>=7 && !ach['daily7']){ach['daily7']=Date.now(); newToast='daily7';}

      // Also evaluate progress achievements
      const ev = evalProgressAchievements({...s, xp});
      if(ev.newly.length){
        Object.assign(ach, ev.achievements);
        newToast = ev.newly[ev.newly.length-1];
      }

      const newState = {
        ...s,
        xp,
        dailyStreak: streak,
        dailyLastDate: today,
        achievements: ach,
        daily: {...s.daily, answered:true, selected:-1, done:true}
      };
      persistState(newState);
      if(newToast) setToast(newToast);
      return newState;
    });
  };

  const saved = loadSave() || {};
  const xp = state.xp || 0;
  const wrongCount = Object.keys(state.wrong || {}).length;

  const achToast = toast ? ACH_DEFS.find(a=>a.id===toast) : null;

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="header">
        <h1>认真交易</h1>
        <div className="xp-bar">
          <span>XP {xp}</span>
          <div className="bar"><div className="fill" style={{width:Math.min(100,(xp%500)/5)+'%'}}></div></div>
          <span>Lv.{Math.floor(xp/500)+1}</span>
        </div>
      </div>
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        <div className="sidebar">
          <a href="learn.html" className="sidebar-btn" title="学习中心" style={{borderColor:'rgba(0,240,255,.15)',color:'var(--cyan)'}}>
            📖
          </a>
          <div className="sidebar-label">学习</div>

          <div className="sidebar-divider"></div>

          <a href="daily.html" className="sidebar-btn active" title="每日一练">
            📅
          </a>
          <div className="sidebar-label">每日</div>

          <a href="codex.html" className="sidebar-btn" title="形态图鉴">
            📚
          </a>
          <div className="sidebar-label">图鉴</div>

          <a href="path.html" className="sidebar-btn" title="学习路径">
            🗺️
          </a>
          <div className="sidebar-label">路径</div>

          <div className="sidebar-divider"></div>

          <a href="index.html?screen=wrong" className="sidebar-btn" title="错题本">
            📕
            {wrongCount>0 && <span className="badge-num">{wrongCount}</span>}
          </a>
          <div className="sidebar-label">错题</div>

          <a href="index.html?screen=ach" className="sidebar-btn" title="成就">
            🏅
          </a>
          <div className="sidebar-label">成就</div>
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <DailyDrill state={state} onAnswer={handleAnswer} onNext={handleNext} />
        </div>
      </div>
      {achToast && (
        <div className="toast">
          {achToast.icon} 成就解锁：{achToast.name}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
