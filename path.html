<body>

<div id="root"></div>
<div id="nav-sidebar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
/* ========== DATA ========== */
const CHAPTERS = [
  {name:'第一章：K线基础', levelCount:8},
  {name:'第二章：单根K线形态', levelCount:10},
  {name:'第三章：双根K线组合', levelCount:8},
  {name:'第四章：三根K线组合', levelCount:8},
  {name:'第五章：市场结构', levelCount:8},
  {name:'第六章：高级形态与策略', levelCount:12},
];

const TOTAL_LEVELS = CHAPTERS.reduce((s,c) => s + c.levelCount, 0);

const STAGES = [
  {name:'阶段一 \u00b7 K线基础',desc:'认识蜡烛图的组成与单根含义',chapters:[0,1],color:'#26a69a'},
  {name:'阶段二 \u00b7 形态组合',desc:'双根与三根K线的反转/持续信号',chapters:[2,3],color:'#2962ff'},
  {name:'阶段三 \u00b7 市场结构',desc:'趋势、支撑阻力与供需关系',chapters:[4],color:'#7b1fa2'},
  {name:'阶段四 \u00b7 实战策略',desc:'综合运用价格行为制定交易策略',chapters:[5],color:'#f7931a'},
];

/* ========== SAVE DATA ========== */
const SAVE_KEY = 'pa_quest_save';
function loadSave() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

/* ========== APP ========== */
function App() {
  const save = loadSave();
  const xp = save ? (save.xp || 0) : 0;
  const stars = save ? (save.stars || {}) : {};
  const completedCount = Object.keys(stars).length;
  const overallPct = Math.round(completedCount / TOTAL_LEVELS * 100);

  return (
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Main content */}
        <div className="screen">
          <div className="level-screen">
            <div className="level-header">
              <a className="back-btn" href="index.html">&larr; 返回</a>
              <span className="level-name">&#x1F5FA;&#xFE0F; 学习路径</span>
              <span></span>
            </div>
            <div className="path-overall">
              总进度 {completedCount}/{TOTAL_LEVELS} 关（{overallPct}%）
            </div>
            {STAGES.map((st, si) => {
              const tot = st.chapters.reduce((a, c) => a + CHAPTERS[c].levelCount, 0);
              const done = st.chapters.reduce((a, c) => {
                let count = 0;
                for (let li = 0; li < CHAPTERS[c].levelCount; li++) {
                  if (stars[`${c}-${li}`]) count++;
                }
                return a + count;
              }, 0);
              const pct = Math.round(done / tot * 100);
              return (
                <div className="path-stage" key={si}>
                  <div className="path-stage-head">
                    <span className="path-dot" style={{background: st.color}}>{si + 1}</span>
                    <div>
                      <div className="path-name">{st.name}</div>
                      <div className="path-desc">{st.desc}</div>
                    </div>
                    <span className="path-pct">{pct}%</span>
                  </div>
                  <div className="path-bar">
                    <div className="fill" style={{width: pct + '%', background: st.color}} />
                  </div>
                  <div className="path-chapters">
                    {st.chapters.map(c => CHAPTERS[c].name).join(' \u00b7 ')}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="shared-nav.js?v=3"></script>

</body>
</html>
